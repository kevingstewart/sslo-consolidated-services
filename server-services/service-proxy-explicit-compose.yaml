services:
  service-proxy-explicit:
    container_name: service-proxy-explicit
    image: service-proxy-explicit
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    build:
      context: .
      dockerfile: service-proxy-explicit.dockerfile
    ports:
      - "3128:3128"
    restart: unless-stopped
    environment:
      - TZ=UTC
      - UPDATE_EP=1
      - ARG_SVC_GATEWAY=198.19.96.245
      - ARG_CLIENT_SUBNET=10.1.10.0/24
      - ARG_SVC_INGRESS=198.19.96.7
    networks:
      default: {}
      net-proxy-e-in:
        ipv4_address: 198.19.96.30
      net-proxy-e-out:
        ipv4_address: 198.19.96.130

networks:
  net-proxy-e-in:
    driver: macvlan
    driver_opts:
      parent: ens6.30
    ipam:
      driver: default
      config:
        - subnet: 198.19.96.0/25

  net-proxy-e-out:
    driver: macvlan
    driver_opts:
      parent: ens6.40
    ipam:
      driver: default
      config:
        - subnet: 198.19.96.128/25
