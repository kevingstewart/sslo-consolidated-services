include:
    - server-services/utility-syslogview-compose.yaml
    - server-services/service-icap-compose.yaml
    - server-services/service-proxy-explicit-compose.yaml
    - server-services/service-proxy-transparent-compose.yaml
    - server-services/service-layer3-compose.yaml
    - server-services/service-tap-compose.yaml
    - server-services/utility-webserver-compose.yaml
    - server-services/utility-juiceshop-compose.yaml

networks:
  default:
    driver: bridge

  webserver-net:
    driver: macvlan
    driver_opts:
      parent: ens6.80
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
